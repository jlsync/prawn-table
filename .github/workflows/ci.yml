name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "6 20 * * 6"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-style:
    runs-on: ubuntu-latest
    env:
      # Keep RuboCop's result cache out of the shared runner home.
      RUBOCOP_CACHE_ROOT: ${{ github.workspace }}/tmp/rubocop_cache
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Check code style
        run: bundle exec rake rubocop

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.3"
          - "3.4"
          - "4.0"
          - "head"
          - "jruby-10.0"
          - "jruby-10.1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake spec
